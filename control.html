<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Control de clase · HCM</title>
<link rel="manifest" href="control.webmanifest">
<meta name="theme-color" content="#631132">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Control HCM">
<link rel="apple-touch-icon" href="control-512.png">
<link rel="icon" href="control-192.png">
<style>
:root{--vino:#631132;--vino2:#7d1b42;--oro:#AE8420;--verde:#4E7B31;--claro:#F5F1F3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#171114;color:#fff;
  font-family:Calibri,"Segoe UI",system-ui,sans-serif;font-size:16px}
body{display:flex;flex-direction:column}

/* ── cabecera delgada ─────────────────────────────────────────────── */
#top{flex:none;height:40px;background:var(--vino);display:flex;align-items:center;gap:9px;padding:0 12px;font-size:14px}
#top b{letter-spacing:.5px;font-size:13.5px;opacity:.9}
#luz{width:9px;height:9px;border-radius:50%;background:#c0392b;flex:none}
#luz.ok{background:#49c06a}
#top .sala{margin-left:auto;background:var(--oro);border-radius:14px;padding:2px 11px;font-weight:700;letter-spacing:2px;font-size:13.5px}
#top .mas{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:7px;padding:4px 9px;font:inherit;font-size:15px}

/* ── espejo de la pantalla del salón ──────────────────────────────── */
#espejo{flex:1;position:relative;overflow:hidden;background:#000;touch-action:none}
#mundo{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:#fff}
#marco{width:1280px;height:720px;border:0;display:block;background:#fff}
#blanco{position:absolute;inset:0;display:none;background:#fff;
  background-image:linear-gradient(rgba(99,17,50,.07) 1px,transparent 1px);background-size:100% 46px}
#tinta{position:absolute;inset:0;width:1280px;height:720px;pointer-events:none}
#capa{position:absolute;inset:0;touch-action:none}
#punta{position:absolute;width:26px;height:26px;border-radius:50%;border:3px solid #fff;
  background:rgba(225,29,46,.75);box-shadow:0 0 12px 4px rgba(225,29,46,.45);pointer-events:none;
  transform:translate(-50%,-50%);display:none;z-index:5}
#tocagiro{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:none;z-index:6;
  background:var(--verde);color:#fff;border:0;border-bottom:5px solid #33521f;border-radius:14px;
  padding:14px 38px;font:inherit;font-weight:700;font-size:18px;letter-spacing:1px}
#tocagiro:active{transform:translateX(-50%) translateY(2px);filter:brightness(1.15)}
#tocagiro.ver{display:block}
#marca{position:absolute;left:10px;top:8px;background:rgba(0,0,0,.6);color:#fff;border-radius:14px;
  padding:4px 11px;font-size:12.5px;pointer-events:none;opacity:0;transition:opacity .25s}
#marca.ver{opacity:1}

/* ── barrita de botones ───────────────────────────────────────────── */
#barra{flex:none;background:#241d20;border-top:3px solid var(--oro);display:flex;flex-wrap:wrap;
  justify-content:center;gap:6px;padding:7px 7px calc(7px + env(safe-area-inset-bottom))}
#barra button{flex:1 1 0;min-width:52px;max-width:92px;background:#3a2e33;border:0;border-bottom:3px solid #151013;
  color:#f3ecee;font:inherit;font-weight:700;font-size:11px;border-radius:10px;padding:7px 4px;line-height:1.1}
#barra button span{display:block;font-size:17px;margin-bottom:1px}
#barra .corte{flex-basis:100%;height:0}
#barra button.on{background:var(--oro);color:#241d20;border-bottom-color:#7d5e13}
#barra button.rojo{background:#a4332a;border-bottom-color:#5e1c17}
#barra .sep{flex:none;width:1px;background:#4a3c41;margin:3px 2px}
#tintas{flex:none;background:#1b1518;border-top:1px solid #4a3c41;
  padding:9px 10px;display:none;gap:9px;align-items:center;flex-wrap:wrap;justify-content:center}
#tintas.ver{display:flex}
#tintas i{width:34px;height:34px;border-radius:9px;border:3px solid transparent;display:block}
#tintas i.sel{border-color:#fff}
#tintas b{font-weight:700;font-size:13px;color:#b5a6ac;margin-left:6px}
#tintas u{text-decoration:none;background:#3a2e33;border-radius:9px;padding:7px 12px;font-size:13px}
#tintas u.sel{background:var(--oro);color:#241d20}

dialog{border:0;border-radius:16px;padding:0;width:94%;max-width:460px;color:#333}
dialog .in{padding:16px}
dialog h2{margin:0 0 10px;color:var(--vino);font-size:19px}
dialog h3{margin:14px 0 6px;color:var(--vino2);font-size:13.5px;text-transform:uppercase;letter-spacing:.5px}
dialog .rej{display:grid;gap:8px;grid-template-columns:1fr 1fr}
dialog .rej.r3{grid-template-columns:1fr 1fr 1fr}
dialog .rej button{background:var(--claro);border:1px solid #e0d7db;border-radius:10px;padding:12px 8px;font:inherit;
  font-weight:700;color:var(--vino);font-size:14px}
dialog label{display:block;font-size:13px;color:#777;margin:10px 0 4px}
dialog input{width:100%;font:inherit;padding:10px;border:1px solid #c7c0c3;border-radius:9px}
dialog .fin{display:flex;gap:9px;margin-top:14px}
dialog .fin button{flex:1;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:700}
dialog .fin .ok{background:var(--vino);color:#fff}
dialog .fin .no{background:var(--claro);color:#555}

/* ── entrada con número ───────────────────────────────────────────── */
#entrar{position:fixed;inset:0;z-index:40;background:var(--vino);display:none;
  flex-direction:column;align-items:center;justify-content:center;padding:20px}
#entrar.ver{display:flex}
#entrar h1{margin:0 0 4px;font-size:24px;text-align:center}
#entrar p{margin:0 0 14px;font-size:15px;opacity:.88;text-align:center;max-width:320px}
#eco{background:#fff;color:var(--vino);border-radius:14px;width:min(320px,86vw);text-align:center;
  font-size:44px;font-weight:700;letter-spacing:12px;padding:10px 0 10px 12px}
#eco.vacio{color:#d6c9ce}
#teclas{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:min(320px,86vw);margin-top:14px}
#teclas button{background:rgba(255,255,255,.14);border:0;border-bottom:4px solid rgba(0,0,0,.22);color:#fff;
  font:inherit;font-size:24px;font-weight:700;border-radius:12px;padding:14px 0}
#teclas .ir{background:var(--oro);font-size:16px;letter-spacing:1px}

/* ── celular acostado: barrita de una sola fila ───────────────────── */
@media (max-height:540px){
  #top{height:30px;font-size:13px}
  #barra{flex-wrap:nowrap;overflow-x:auto;gap:5px;padding:5px 6px calc(5px + env(safe-area-inset-bottom))}
  #barra .corte{display:none}
  #barra button{min-width:46px;max-width:none;font-size:9.5px;padding:4px 3px;border-bottom-width:2px}
  #barra button span{font-size:15px;margin:0}
  #tintas{padding:6px 8px;gap:7px}
  #tintas i{width:26px;height:26px}
  #tintas u{padding:5px 10px;font-size:12px}
}
</style>
</head>
<body>

<div id="entrar">
  <h1>Control de clase</h1>
  <p>Escribe el n&uacute;mero que aparece en la pantalla del sal&oacute;n, o escanea su QR.</p>
  <div id="eco" class="vacio">— — —</div>
  <div id="teclas">
    <button>1</button><button>2</button><button>3</button>
    <button>4</button><button>5</button><button>6</button>
    <button>7</button><button>8</button><button>9</button>
    <button data-k="del">&larr;</button><button>0</button><button class="ir" data-k="ok">ENTRAR</button>
  </div>
</div>

<div id="top">
  <div id="luz"></div><b id="rotulo">CONECTANDO&hellip;</b>
  <span class="sala" id="hsala">301</span>
  <button class="mas" id="bmenu">&#9776;</button>
</div>

<div id="espejo">
  <div id="mundo">
    <iframe id="marco" title="Pantalla del sal&oacute;n" scrolling="no"></iframe>
    <div id="blanco"></div>
    <canvas id="tinta" width="1280" height="720"></canvas>
  </div>
  <div id="capa"></div>
  <div id="punta"></div>
  <button id="tocagiro">TOCAR</button>
  <div id="marca">Tocar</div>
</div>

<div id="tintas">
  <i data-c="#e11d2e" class="sel" style="background:#e11d2e"></i>
  <i data-c="#631132" style="background:#631132"></i>
  <i data-c="#1b6ac9" style="background:#1b6ac9"></i>
  <i data-c="#2e9e4f" style="background:#2e9e4f"></i>
  <i data-c="#AE8420" style="background:#AE8420"></i>
  <i data-c="#111111" style="background:#111"></i>
  <b>Grueso</b>
  <u data-g="3">fino</u><u data-g="6" class="sel">medio</u><u data-g="12">grueso</u>
</div>

<div id="barra">
  <button id="m-tocar" class="on"><span>&#128070;</span>Tocar</button>
  <button id="m-escribir"><span>&#9999;</span>Escribir</button>
  <button id="m-laser"><span>&#128308;</span>L&aacute;ser</button>
  <button id="m-giro"><span>&#128241;</span>Inclinar</button>
  <button id="b-tinta"><span>&#127912;</span>Tinta</button>
  <div class="corte"></div>
  <button id="b-deshacer"><span>&#8630;</span>Deshacer</button>
  <button id="b-borrar" class="rojo"><span>&#10006;</span>Borrar</button>
  <button id="b-lienzo"><span>&#9634;</span>Lienzo</button>
  <button id="b-negro"><span>&#9728;</span>Negro</button>
  <button id="b-ajustar"><span>&#9974;</span>Ajustar</button>
</div>

<dialog id="dmenu"><div class="in">
  <h2>Clase</h2>
  <h3>Abrir en la pantalla</h3>
  <div class="rej" id="m-lecs"></div>
  <h3>Ir a la secci&oacute;n</h3>
  <div class="rej r3" id="m-secs"></div>
  <h3>Revisar ejercicios</h3>
  <div class="rej r3" id="m-revs"></div>
  <h3>Tama&ntilde;o de letra en la pantalla</h3>
  <div class="rej r3">
    <button data-zoom="-">A &minus;</button><button data-zoom="0">100%</button><button data-zoom="+">A &plus;</button>
  </div>
  <h3>Otros</h3>
  <div class="rej">
    <button data-op='{"t":"clic","v":"#clave"}'>Clave docente</button>
    <button id="m-cfg">Ajustes de conexi&oacute;n</button>
    <button id="m-probar">Probar la conexi&oacute;n</button>
    <button id="m-recargar">Bajar la versi&oacute;n nueva</button>
  </div>
  <p id="m-res" style="font-size:14px;color:#555;margin:10px 0 0;line-height:1.45"></p>
  <div class="fin"><button class="no" id="m-cerrar">Cerrar</button></div>
</div></dialog>

<dialog id="dcfg"><div class="in">
  <h2>Ajustes</h2>
  <label>C&oacute;digo de sala</label>
  <input id="icsala" maxlength="8" autocapitalize="characters">
  <label>Direcci&oacute;n del servidor del HCM (para controlar otra computadora)</label>
  <input id="icep" placeholder="https://script.google.com/macros/s/…/exec">
  <div class="fin"><button class="no" id="bno">Cerrar</button><button class="ok" id="bok">Guardar</button></div>
</div></dialog>

<script>
if('serviceWorker' in navigator){
  addEventListener('load', function(){ navigator.serviceWorker.register('sw-control.js').catch(function(){}); });
}
</script>
<script src="canal.js"></script>
<script>
(function(){
  var W = 1280, H = 720;                       // la pantalla del salón, en grande
  var par = new URLSearchParams(location.search);
  var sala = (par.get('sala') || localStorage.getItem('hcm_aula_sala') || '').toUpperCase().trim();
  if(par.get('ep')) Canal.guardarEndpoint(par.get('ep'));

  /* ── entrada con número ─────────────────────────────────────────── */
  var cap=document.getElementById('entrar'), eco=document.getElementById('eco'), buf='';
  function pintaEco(){ eco.textContent = buf || '— — —'; eco.classList.toggle('vacio', !buf); }
  document.querySelectorAll('#teclas button').forEach(function(b){
    b.onclick=function(){
      var k=b.dataset.k; try{ navigator.vibrate && navigator.vibrate(10); }catch(e){}
      if(k==='del'){ buf=buf.slice(0,-1); pintaEco(); return; }
      if(k==='ok'){ if(buf.length<3) return; localStorage.setItem('hcm_aula_sala',buf);
                    location.search='?sala='+encodeURIComponent(buf); return; }
      if(buf.length<6){ buf+=b.textContent.trim(); pintaEco(); }
    };
  });
  if(!sala){ cap.classList.add('ver'); pintaEco(); return; }
  localStorage.setItem('hcm_aula_sala', sala);
  document.getElementById('hsala').textContent = sala;

  var canal = new Canal(sala, 'control', recibir);
  function manda(op){ canal.enviar(op); }
  function vibra(){ try{ navigator.vibrate && navigator.vibrate(10); }catch(e){} }

  /* ── lecciones ──────────────────────────────────────────────────── */
  var LECCIONES = [
    {f:'clase-29-oct.html', n:'Clase de hoy · 29 oct', c:'Clase 29 oct',
     secs:[['1','Presentation','#p1'],['2','Practice','#p2'],['3','Production','#p3']],
     revs:[['Ordenar','#rev-o'],['Adverbios','#rev-adv'],['Sam','#rev-sam'],['Adj/Adv','#rev-par'],
           ['Carrera &rarr;','#ca-sig'],['Carrera: abrir','#ca-abrir'],['Carrera: correcta','#ca-clave']]},
    {f:'leccion-06-should-could.html', n:'Lección 6 · Should / could', c:'Lección 6',
     secs:[['1','Presentation','#p1'],['2','Practice','#p2'],['3','Production','#p3']],
     revs:[['Ordenar','#rev-o'],['Adverbios','#rev-adv'],['Sam','#rev-sam'],['Adj/Adv','#rev-par'],['How','#rev-how']]},
    {f:'leccion-05-vocabulary.html', n:'Lección 5 · Vocabulary', c:'Lección 5',
     secs:[['1','Presentation','#p1'],['2','Practice','#p2'],['3','Production','#p3']],
     revs:[['Palabras','#rev-d1'],['Ej. A','#rev-ea'],['Ej. B','#rev-eb'],['Caja','#rev-ec'],['Tell','#rev-ed']]},
    {f:'leccion-04-indirect-commands.html', n:'Lección 4 · Indirect commands', c:'Lección 4',
     secs:[['1','Presentation','#p1'],['2','Listening','#p2'],['3','Preguntas','#p3'],['4','Ejercicios','#p4'],['5','Production','#p5']],
     revs:[['Preguntas','#revisarQ'],['A','#revA'],['B','#revB'],['C','#revC'],['D','#revD'],['E','#revE'],['F','#revF']]},
    {f:'index.html', n:'Índice de actividades', c:'Índice', secs:[], revs:[]}
  ];
  var actual = LECCIONES[0];

  /* ── el espejo ──────────────────────────────────────────────────── */
  var espejo=document.getElementById('espejo'), mundo=document.getElementById('mundo'),
      marco=document.getElementById('marco'), capa=document.getElementById('capa'),
      tinta=document.getElementById('tinta'), tx=tinta.getContext('2d'),
      blanco=document.getElementById('blanco'), marca=document.getElementById('marca');
  var k=0, ox=0, oy=0, kBase=0, ajustado=false;
  function medir(){
    var r=espejo.getBoundingClientRect();
    if(!r.width || !r.height) return;
    kBase = Math.min(r.width/W, r.height/H);
    if(!ajustado || k < kBase){ k = kBase; ox=0; oy=0; ajustado=true; }
    limita(); aplicaT();
  }
  function limita(){
    var r=espejo.getBoundingClientRect();
    if(k < kBase) k = kBase;
    if(k > kBase*6) k = kBase*6;
    var anchoV = W*k, altoV = H*k;
    ox = anchoV <= r.width ? (r.width-anchoV)/2 : Math.min(0, Math.max(r.width-anchoV, ox));
    oy = altoV  <= r.height? (r.height-altoV)/2 : Math.min(0, Math.max(r.height-altoV, oy));
  }
  function aplicaT(){
    mundo.style.transform='translate('+ox+'px,'+oy+'px) scale('+k+')';
    if(typeof ponPunta==='function' && modo==='giro') ponPunta(donde);
  }
  addEventListener('resize', medir);
  addEventListener('orientationchange', function(){ setTimeout(medir,250); });
  try{ new ResizeObserver(medir).observe(espejo); }catch(e){}

  function doc(){ try{ return marco.contentDocument; }catch(e){ return null; } }
  var cargando=false;
  marco.addEventListener('load', function(){
    cargando=false;
    try{
      var dd=doc();
      if(dd){
        dd.documentElement.style.scrollBehavior='auto';
        dd.defaultView.addEventListener('scroll', redibujaTinta, {passive:true});
      }
    }catch(e){}
    redibujaTinta();
  });
  function abrir(archivo, avisa){
    cargando=true; marco.src=archivo;
    if(avisa) manda({t:'lec', v:archivo});
  }

  /* ── tinta: se queda pegada al texto, no a la pantalla ──────────── */
  var trazos=[];
  function despLec(){ try{ var d=doc(); return (d&&d.defaultView)? d.defaultView.scrollY : 0; }catch(e){ return 0; } }
  function redibujaTinta(){
    tx.clearRect(0,0,W,H); tx.lineCap='round'; tx.lineJoin='round';
    var sy=despLec();
    trazos.forEach(function(t){
      tx.strokeStyle=t.c; tx.lineWidth=t.g; tx.beginPath();
      t.p.forEach(function(q,i){
        var x=q[0]*W, y=(t.a==='doc') ? (q[1]-sy) : q[1]*H;
        if(i===0) tx.moveTo(x,y); else tx.lineTo(x,y);
      });
      tx.stroke();
    });
  }

  /* punto de la pantalla grande a partir de un toque */
  function punto(t){
    var r=espejo.getBoundingClientRect();
    var x=(t.clientX-r.left-ox)/k, y=(t.clientY-r.top-oy)/k;
    return [Math.max(0,Math.min(1,x/W)), Math.max(0,Math.min(1,y/H))];
  }
  function avisa(txt){ marca.textContent=txt; marca.classList.add('ver');
    clearTimeout(avisa.t); avisa.t=setTimeout(function(){ marca.classList.remove('ver'); },1200); }

  /* un toque = clic de verdad, aquí y allá */
  function tocaLocal(n){
    var d=doc(); if(!d) return;
    var x=n[0]*W, y=n[1]*H, el=d.elementFromPoint(x,y); if(!el) return;
    var base={bubbles:true,cancelable:true,composed:true,clientX:x,clientY:y,view:d.defaultView,button:0};
    try{
      el.dispatchEvent(new PointerEvent('pointerdown',Object.assign({pointerId:1,pointerType:'touch',isPrimary:true},base)));
      el.dispatchEvent(new MouseEvent('mousedown',base));
      el.dispatchEvent(new PointerEvent('pointerup',Object.assign({pointerId:1,pointerType:'touch',isPrimary:true},base)));
      el.dispatchEvent(new MouseEvent('mouseup',base));
    }catch(e){}
    if(typeof el.click==='function') el.click();
  }

  /* ── modos ──────────────────────────────────────────────────────── */
  var modo='tocar';
  function ponModo(m){
    if(modo==='giro' && m!=='giro') apagaGiro();
    modo=m;
    ['tocar','escribir','laser','giro'].forEach(function(x){
      document.getElementById('m-'+x).classList.toggle('on', x===m);
    });
    document.getElementById('tocagiro').classList.toggle('ver', m==='giro');
    punta.style.display = m==='giro' ? 'block' : 'none';
    if(m==='giro') prendeGiro();
    if(m!=='laser') manda({t:'laser', v:null});
    avisa(m==='tocar'?'Tocar y mover':m==='escribir'?'Escribiendo sobre la pantalla':'Láser');
  }
  document.getElementById('m-tocar').onclick=function(){ ponModo('tocar'); };
  document.getElementById('m-escribir').onclick=function(){ ponModo('escribir'); };
  document.getElementById('m-laser').onclick=function(){ ponModo('laser'); };
  document.getElementById('m-giro').onclick=function(){ ponModo('giro'); };

  /* ── mover el puntero inclinando el teléfono ────────────────────── */
  var punta=document.getElementById('punta'), giroOn=false, ref=null, ultG=0, donde=[0.5,0.5];
  function ponPunta(n){
    donde=n;
    var r=espejo.getBoundingClientRect();
    punta.style.left=(ox + n[0]*W*k)+'px';
    punta.style.top =(oy + n[1]*H*k)+'px';
  }
  function alGiro(e){
    if(e.beta===null || e.gamma===null) return;
    if(!ref) ref={b:e.beta, g:e.gamma};
    var x=0.5+(e.gamma-ref.g)/50, y=0.5+(e.beta-ref.b)/50;
    ponPunta([Math.min(1,Math.max(0,x)), Math.min(1,Math.max(0,y))]);
    if(Date.now()-ultG>80){ ultG=Date.now(); canal.enviar({t:'cur', v:donde}); }
  }
  function prendeGiro(){
    ref=null; ponPunta([0.5,0.5]);
    if(giroOn) return;
    function engancha(){ addEventListener('deviceorientation', alGiro); giroOn=true;
      avisa('Inclina el tel\u00e9fono \u00b7 toca con el bot\u00f3n verde'); }
    try{
      if(typeof DeviceOrientationEvent!=='undefined' && DeviceOrientationEvent.requestPermission){
        DeviceOrientationEvent.requestPermission().then(function(r){
          if(r==='granted') engancha(); else avisa('El tel\u00e9fono no dio permiso del sensor');
        }).catch(function(){ avisa('El tel\u00e9fono no dio permiso del sensor'); });
      } else engancha();
    }catch(err){ avisa('Este tel\u00e9fono no trae sensor de movimiento'); }
  }
  function apagaGiro(){
    if(giroOn){ removeEventListener('deviceorientation', alGiro); giroOn=false; }
    ref=null; punta.style.display='none'; manda({t:'cur', v:null});
  }
  document.getElementById('tocagiro').onclick=function(){
    manda({t:'tap', v:donde}); tocaLocal(donde); vibra();
  };

  /* ── gestos ─────────────────────────────────────────────────────── */
  var dedos={}, pinza=null, uno=null, trazando=false, buffer=[], ultimo=0, ultimoScroll=0;
  var color='#e11d2e', grosor=6, enLienzo=false;

  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
  function centro(a,b){ return {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; }

  capa.addEventListener('pointerdown', function(e){
    try{ capa.setPointerCapture(e.pointerId); }catch(err){}
    dedos[e.pointerId]={x:e.clientX,y:e.clientY};
    var ids=Object.keys(dedos);
    if(ids.length===2){
      cierraTrazo();
      var a=dedos[ids[0]], b=dedos[ids[1]];
      pinza={d:dist(a,b), c:centro(a,b), k:k, ox:ox, oy:oy};
      uno=null; return;
    }
    if(ids.length>2) return;
    var n=punto(e);
    uno={x:e.clientX, y:e.clientY, x0:e.clientX, y0:e.clientY, movido:false, n:n, t:Date.now()};
    if(modo==='giro'){ ref=null; avisa('Centrado'); return; }
    if(modo==='escribir'){
      trazando=true; buffer=[];
      var ancla = enLienzo ? 'pant' : 'doc';
      var q = ancla==='doc' ? [n[0], n[1]*H + despLec()] : n;
      trazos.push({c:color, g:grosor, a:ancla, p:[q]});
      manda({t:'trazo', v:[q], c:color, g:grosor, a:ancla});
      redibujaTinta();
    } else if(modo==='laser'){
      manda({t:'laser', v:n});
    }
  });

  capa.addEventListener('pointermove', function(e){
    if(!dedos[e.pointerId]) return;
    dedos[e.pointerId]={x:e.clientX,y:e.clientY};
    var ids=Object.keys(dedos);

    if(ids.length>=2 && pinza){
      var a=dedos[ids[0]], b=dedos[ids[1]];
      var d2=dist(a,b), c2=centro(a,b);
      var nk=Math.max(kBase, Math.min(kBase*6, pinza.k * (d2/pinza.d)));
      ox = c2.x - (pinza.c.x - pinza.ox) * (nk/pinza.k);
      oy = c2.y - (pinza.c.y - pinza.oy) * (nk/pinza.k);
      k = nk; limita(); aplicaT();
      return;
    }
    if(!uno) return;
    var dx=e.clientX-uno.x, dy=e.clientY-uno.y;
    if(Math.abs(e.clientX-uno.x0)>7 || Math.abs(e.clientY-uno.y0)>7) uno.movido=true;
    uno.x=e.clientX; uno.y=e.clientY;
    var n=punto(e);

    if(modo==='escribir' && trazando){
      var t0=trazos[trazos.length-1];
      var q = (t0 && t0.a==='doc') ? [n[0], n[1]*H + despLec()] : n;
      if(t0) t0.p.push(q);
      redibujaTinta();
      buffer.push(q);
      if(Date.now()-ultimo>120 && buffer.length){ ultimo=Date.now(); canal.enviar({t:'sigue', v:buffer}); buffer=[]; }
      return;
    }
    if(modo==='laser'){
      if(Date.now()-ultimo>90){ ultimo=Date.now(); canal.enviar({t:'laser', v:n}); }
      return;
    }
    /* modo tocar: arrastrar mueve la lección, aquí y en el salón */
    var d=doc();
    if(d && d.defaultView && uno.movido){
      d.defaultView.scrollBy(0, -dy/k);
      if(Date.now()-ultimoScroll>70){
        ultimoScroll=Date.now();
        canal.enviar({t:'pos', v:Math.round(d.defaultView.scrollY)});
      }
    }
  });

  function cierraTrazo(){
    if(trazando && buffer.length){ manda({t:'sigue', v:buffer}); buffer=[]; }
    trazando=false;
  }
  function suelta(e){
    delete dedos[e.pointerId];
    var ids=Object.keys(dedos);
    if(ids.length<2) pinza=null;
    if(uno && ids.length===0){
      if(modo==='tocar'){
        if(!uno.movido && Date.now()-uno.t<500){ manda({t:'tap', v:uno.n}); tocaLocal(uno.n); vibra(); }
        else { var d=doc(); if(d&&d.defaultView) manda({t:'pos', v:Math.round(d.defaultView.scrollY)}); }
      }
      if(modo==='laser' && !uno.movido){ /* queda el punto donde lo dejó */ }
      cierraTrazo();
      uno=null;
    }
  }
  capa.addEventListener('pointerup', suelta);
  capa.addEventListener('pointercancel', suelta);

  /* ── botones de la barrita ──────────────────────────────────────── */
  var cajaTinta=document.getElementById('tintas'), btnTinta=document.getElementById('b-tinta');
  function cierraTinta(){ cajaTinta.classList.remove('ver'); btnTinta.classList.remove('on'); medir(); }
  btnTinta.onclick=function(){
    var v=cajaTinta.classList.toggle('ver'); this.classList.toggle('on', v); medir();
  };
  cajaTinta.querySelectorAll('i').forEach(function(s){
    s.onclick=function(){ color=s.dataset.c; manda({t:'pluma', c:color, g:grosor});
      cajaTinta.querySelectorAll('i').forEach(function(x){x.classList.remove('sel')}); s.classList.add('sel');
      if(modo!=='escribir') ponModo('escribir');
      cierraTinta(); };
  });
  cajaTinta.querySelectorAll('u').forEach(function(s){
    s.onclick=function(){ grosor=+s.dataset.g; manda({t:'pluma', c:color, g:grosor});
      cajaTinta.querySelectorAll('u').forEach(function(x){x.classList.remove('sel')}); s.classList.add('sel');
      cierraTinta(); };
  });
  document.getElementById('b-deshacer').onclick=function(){ trazos.pop(); redibujaTinta(); manda({t:'deshacer'}); };
  document.getElementById('b-borrar').onclick=function(){
    trazos=[]; redibujaTinta(); manda({t:'borrar'});
  };
  document.getElementById('b-lienzo').onclick=function(){
    enLienzo=!enLienzo; this.classList.toggle('on',enLienzo);
    blanco.style.display = enLienzo ? 'block':'none';
    manda({t:'lienzo', v:enLienzo});
    if(enLienzo && modo!=='escribir') ponModo('escribir');
  };
  var tapado=false;
  document.getElementById('b-negro').onclick=function(){
    tapado=!tapado; this.classList.toggle('on',tapado); manda({t:'tapa', v:tapado});
  };
  document.getElementById('b-ajustar').onclick=function(){ ajustado=false; medir(); avisa('Pantalla completa'); };

  /* ── menú ───────────────────────────────────────────────────────── */
  var dmenu=document.getElementById('dmenu'), dcfg=document.getElementById('dcfg');
  function pintaMenu(){
    var cl=document.getElementById('m-lecs'); cl.innerHTML='';
    LECCIONES.forEach(function(L){
      var b=document.createElement('button'); b.textContent=L.n;
      b.onclick=function(){ actual=L; abrir(L.f, true); pintaMenu(); dmenu.close(); };
      cl.appendChild(b);
    });
    var cs=document.getElementById('m-secs'); cs.innerHTML='';
    actual.secs.forEach(function(x){
      var b=document.createElement('button'); b.textContent=x[1];
      b.onclick=function(){ manda({t:'ir', v:x[2]}); irLocal(x[2]); dmenu.close(); };
      cs.appendChild(b);
    });
    var cr=document.getElementById('m-revs'); cr.innerHTML='';
    actual.revs.forEach(function(x){
      var b=document.createElement('button'); b.innerHTML=x[0];
      b.onclick=function(){ manda({t:'clic', v:x[1]}); clicLocal(x[1]); };
      cr.appendChild(b);
    });
  }
  function irLocal(sel){ var d=doc(); if(d){ var e=d.querySelector(sel); if(e) e.scrollIntoView({block:'start'}); } }
  function clicLocal(sel){ var d=doc(); if(d){ var b=d.querySelector(sel); if(b) b.click(); } }
  document.getElementById('bmenu').onclick=function(){ pintaMenu(); dmenu.showModal(); };
  document.getElementById('m-cerrar').onclick=function(){ dmenu.close(); };
  dmenu.querySelectorAll('[data-op]').forEach(function(b){
    b.onclick=function(){ var op=JSON.parse(b.dataset.op); manda(op); if(op.t==='clic') clicLocal(op.v); };
  });
  var z=1;
  dmenu.querySelectorAll('[data-zoom]').forEach(function(b){
    b.onclick=function(){ var d=b.dataset.zoom;
      z = d==='0' ? 1 : Math.min(2.2, Math.max(0.6, z + (d==='+'?0.15:-0.15)));
      manda({t:'zoom', v:Math.round(z*100)/100});
      var dd=doc(); if(dd&&dd.body) dd.body.style.zoom=z; };
  });
  var res=document.getElementById('m-res');
  document.getElementById('m-probar').onclick=function(){
    res.textContent='Probando\u2026 (5 segundos)';
    var marca0 = ultimoEstoy;
    manda({t:'hola'});
    setTimeout(function(){
      if(ultimoEstoy > marca0){
        res.innerHTML='<b style="color:#2f7d32">La pantalla contest\u00f3.</b> Est\u00e1n enlazados en la sala '+sala+'.';
      } else if(canal.estado.remoto==='conectado'){
        res.innerHTML='<b style="color:#a4332a">El servidor s\u00ed responde, pero la pantalla no contesta.</b> '+
          'Revisa que la pantalla del sal\u00f3n est\u00e9 abierta y que muestre el n\u00famero <b>'+sala+'</b>.';
      } else if(!Canal.endpoint()){
        res.innerHTML='<b style="color:#a4332a">Este aparato no encontr\u00f3 el servidor del HCM.</b> '+
          'Usa el bot\u00f3n "Bajar la versi\u00f3n nueva" y vuelve a intentar.';
      } else {
        res.innerHTML='<b style="color:#a4332a">No se pudo hablar con el servidor.</b> Revisa el internet del aparato.';
      }
    }, 5000);
  };
  document.getElementById('m-recargar').onclick=function(){
    res.textContent='Bajando la versi\u00f3n nueva\u2026';
    var fin=function(){ location.href = 'control.html?sala='+encodeURIComponent(sala)+'&v='+Date.now(); };
    try{
      if('serviceWorker' in navigator){
        navigator.serviceWorker.getRegistrations().then(function(rs){
          return Promise.all(rs.map(function(r){ return r.unregister(); }));
        }).then(function(){ return caches.keys(); })
          .then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); })
          .then(fin).catch(fin);
      } else fin();
    }catch(e){ fin(); }
  };
  document.getElementById('m-cfg').onclick=function(){
    document.getElementById('icsala').value=sala;
    document.getElementById('icep').value=Canal.endpoint();
    dmenu.close(); dcfg.showModal();
  };
  document.getElementById('bno').onclick=function(){ dcfg.close(); };
  document.getElementById('bok').onclick=function(){
    var ns=(document.getElementById('icsala').value||'301').toUpperCase().trim();
    Canal.guardarEndpoint(document.getElementById('icep').value);
    localStorage.setItem('hcm_aula_sala', ns);
    location.search='?sala='+encodeURIComponent(ns);
  };

  var ultimoEstoy = 0;
  /* ── lo que llega de la pantalla (o de otro control) ────────────── */
  function recibir(op){
    var d=doc();
    switch(op.t){
      case 'estoy':
        ultimoEstoy = Date.now();
        if(op.v && marco.src.indexOf(op.v)<0){
          var L=LECCIONES.filter(function(x){return x.f===op.v;})[0];
          if(L){ actual=L; }
          abrir(op.v, false);
          setTimeout(function(){ var dd=doc(); if(dd&&dd.defaultView) dd.defaultView.scrollTo(0, op.s||0); }, 900);
        }
        break;
      case 'lec':
        if(op.v && marco.src.indexOf(op.v)<0){
          var L2=LECCIONES.filter(function(x){return x.f===op.v;})[0];
          if(L2) actual=L2;
          trazos=[]; redibujaTinta();
          abrir(op.v, false);
        }
        break;
      case 'pos':   if(d&&d.defaultView){ d.defaultView.scrollTo(0, op.v); redibujaTinta(); } break;
      case 'ir':    if(d){ var e=d.querySelector(op.v); if(e) e.scrollIntoView({block:'start'}); } break;
      case 'clic':  if(d){ var b2=d.querySelector(op.v); if(b2) b2.click(); } break;
      case 'tap':   tocaLocal(op.v); break;
      case 'pluma': color=op.c||color; grosor=op.g||grosor; break;
      case 'trazo': trazos.push({c:op.c||color, g:op.g||grosor, a:op.a||'pant', p:op.v}); redibujaTinta(); break;
      case 'sigue': var u=trazos[trazos.length-1]; if(u){ u.p=u.p.concat(op.v); redibujaTinta(); } break;
      case 'borrar': trazos=[]; redibujaTinta(); break;
      case 'deshacer': trazos.pop(); redibujaTinta(); break;
      case 'lienzo': enLienzo=!!op.v; blanco.style.display=enLienzo?'block':'none';
                     document.getElementById('b-lienzo').classList.toggle('on', enLienzo); break;
      case 'tapa':   document.getElementById('b-negro').classList.toggle('on', !!op.v); break;
    }
  }

  var luz=document.getElementById('luz'), rotulo=document.getElementById('rotulo');
  setInterval(function(){
    var r = canal.estado.remoto;
    var cerca = (Date.now() - ultimoEstoy) < 20000;     // la pantalla contestó hace poco
    var ok = (r==='conectado') || cerca;
    luz.classList.toggle('ok', ok);
    rotulo.textContent = ok ? 'EN VIVO'
      : (r==='esperando' ? 'CONECTANDO…'
      : (r==='error' ? 'SIN SERVIDOR' : 'SOLO ESTE EQUIPO'));
  }, 1000);

  medir();
  requestAnimationFrame(medir);
  setTimeout(medir, 300);
  abrir(actual.f, false);
  manda({t:'hola'});
  setTimeout(function(){ avisa('Toca para marcar · dos dedos para acercar'); }, 1200);
})();
</script>
</body>
</html>
